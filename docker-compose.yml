version: '3.8'

services:
  # 1. Redis High-Speed In-Memory Cache
  redis:
    image: redis:alpine
    container_name: alltools-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # 2. Python FastAPI Processing Engine
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: alltools-backend-python
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_UPLOAD_SIZE_MB=500
      - TEMP_FILE_TTL_MINUTES=30
      - RATE_LIMIT_PER_MINUTE=60
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
    volumes:
      - ./backend-python/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # 3. Node.js Admin & Ad Management Backend
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: alltools-backend-node
    restart: unless-stopped
    environment:
      - PORT=5000
      - JWT_SECRET=alltools_production_admin_secret_key_2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      - redis

  # 4. React Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alltools-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  # 5. Nginx Production Gateway
  nginx:
    image: nginx:alpine
    container_name: alltools-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend-python
      - backend-node
      - frontend

volumes:
  redis_data:
